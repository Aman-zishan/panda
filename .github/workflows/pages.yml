name: Publish PANDA website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'scripts/**', 'mkdocs.yml', 'requirements-docs.txt', 'LICENSE.md', 'BRAND.md', '.github/workflows/pages.yml']
  workflow_dispatch:
  pull_request:
    paths: ['site/**', 'docs/**', 'scripts/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Build website and documentation
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
