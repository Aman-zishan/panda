site_name: PANDA Docs
site_description: Product requirements and build documentation for PANDA.
site_url: https://aman-zishan.github.io/panda/docs/
repo_url: https://github.com/Aman-zishan/panda
repo_name: PANDA on GitHub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site/docs
strict: true

theme:
  name: material
  logo: https://aman-zishan.github.io/panda/assets/panda-logo.webp
  favicon: https://aman-zishan.github.io/panda/assets/panda-logo.webp
  font: false
  palette:
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

nav:
  - Start here:
      - Overview: index.md
      - Product philosophy: product-philosophy.md
      - Local and connected features: feature-matrix.md
  - Using PANDA:
      - Knob controls: knob-interactions.md
      - Focus sessions: focus-experience.md
      - Tiny world: tiny-world.md
      - Voice capture: voice-capture.md
  - Releases:
      - PANDA device: basic-release.md
      - Connect: connect-release.md
  - Build preparation:
      - Before hardware arrives: pre-hardware-checklist.md
      - Project guide: repository-structure.md
  - Project:
      - Decisions: decisions.md
      - Roadmap: roadmap.md
# The docs hook adds uncategorized new Markdown pages under More docs.
plugins:
  - search
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra:
  homepage: https://aman-zishan.github.io/panda/
extra_css:
  - stylesheets/extra.css
hooks:
  - scripts/docs_hooks.py
validation:
  links:
    not_found: warn
    unrecognized_links: warn
